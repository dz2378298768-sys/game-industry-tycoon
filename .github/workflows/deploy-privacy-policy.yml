name: Deploy privacy policy

on:
  push:
    branches: [main]
    paths:
      - privacy-policy.html
      - .github/workflows/deploy-privacy-policy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare privacy policy site
        run: |
          mkdir -p privacy-site
          cp privacy-policy.html privacy-site/index.html
          cp privacy-policy.html privacy-site/privacy-policy.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: privacy-site
      - id: deployment
        uses: actions/deploy-pages@v4
